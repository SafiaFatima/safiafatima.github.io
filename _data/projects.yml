- layout: top-middle
  name: Hierarchical LLM-Based Failure Recovery for Autonomous Driving
  github: cureIT-project/Using-Large-Language-Models-to-Guide-Hierarchical-Recovery-in-Autonomous-Driving
  quote: >
    Ph.D. research project on using large language models for autonomous driving recovery
  description: | # this will include new lines to allow paragraphs
    - A hierarchical failure recovery framework that uses large language models (LLMs) to generate multi-step recovery plans when trained policies enter unsafe states.
    - Integrates recovery mechanism with a proximal policy optimization agent trained in the CARLA simulator.
    - Evaluates recovery success across four failure categories: collisions, lane departures, vehicle stalling, and speeding violations.
